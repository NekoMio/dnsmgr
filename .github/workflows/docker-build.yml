# 手动触发：构建多架构镜像（amd64 / arm64），推送 latest 至 GitHub Container Registry（GHCR）。
# 构建上下文为仓库根目录，镜像使用当前分支的源码（含本仓库自己的改动）。
#
# 无需额外 Secrets：使用仓库自带的 GITHUB_TOKEN 登录 ghcr.io。
# 首次推送后，如需匿名拉取，请到 GitHub → Packages → dnsmgr → Package settings 将可见性改为 Public。
#
# 手动构建命令（本地验证用）：
#   docker build -f .github/docker/Dockerfile -t dnsmgr:test .

name: Docker Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push (GHCR, latest only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 不推送 attestations，保持镜像 manifest 简单，避免部分客户端解析问题
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
