# 手动触发：构建多架构镜像（amd64 / arm64），推送 latest 至 GitHub Container Registry（GHCR）。
#
# 不使用 QEMU：amd64 在 ubuntu-latest 原生构建，arm64 在 ubuntu-24.04-arm 原生构建，
# 两个 job 各推一个单架构 digest，最后合并为多架构 manifest。
# （arm64 托管 runner 对 public 仓库免费；若不可用可把 runner 改为 ubuntu-22.04-arm）
#
# 构建上下文为仓库根目录，镜像使用当前分支的源码（含本仓库自己的改动）。
# 无需额外 Secrets：使用仓库自带的 GITHUB_TOKEN 登录 ghcr.io。
# 首次推送后，如需匿名拉取，请到 GitHub → Packages → dnsmgr → Package settings 将可见性改为 Public。
#
# 手动构建命令（本地验证用）：
#   docker build -f .github/docker/Dockerfile -t dnsmgr:test .

name: Docker Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # 不推送 attestations，保持镜像 manifest 简单，避免部分客户端解析问题
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        run: |
          cd "${{ runner.temp }}/digests"
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.name }}:latest" \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:latest"
